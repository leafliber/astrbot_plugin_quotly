<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotly 语录管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <span class="nav-brand">Quotly 语录管理</span>
      <div class="nav-stats" id="nav-stats">
        <span class="stat-chip" id="stat-records"><span class="skel-inline"></span></span>
        <span class="stat-chip" id="stat-messages"><span class="skel-inline"></span></span>
        <span class="stat-chip" id="stat-groups"><span class="skel-inline"></span></span>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div id="view-records" class="view active">
      <div class="toolbar">
        <select id="group-filter">
          <option value="">全部群组</option>
        </select>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜索语录..." />
          <button id="search-btn">搜索</button>
          <button id="clear-search-btn" class="btn-ghost" hidden>清除</button>
        </div>
        <div class="toolbar-spacer"></div>
        <button id="upload-btn">上传图片</button>
        <button id="export-btn" class="btn-ghost">导出</button>
        <button id="import-btn" class="btn-ghost">导入</button>
      </div>

      <div class="records-grid" id="records-list"></div>

      <div class="pagination" id="pagination" hidden>
        <button id="prev-btn" class="btn-ghost">上一页</button>
        <span id="page-info">1 / 1</span>
        <button id="next-btn" class="btn-ghost">下一页</button>
      </div>

      <div class="empty-state" id="empty-state" hidden>
        <p>暂无语录记录</p>
      </div>
    </div>

    <div id="view-detail" class="view">
      <div class="detail-header">
        <button id="back-btn" class="btn-ghost">← 返回列表</button>
        <button id="save-messages-btn" hidden>保存修改</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="全尺寸图片" />
  </div>

  <div id="upload-modal" class="modal-overlay" hidden>
    <div class="modal-content">
      <h2>上传语录图片</h2>
      <div class="form-group">
        <label>选择图片（支持多选）</label>
        <input type="file" id="upload-files" accept="image/*" multiple />
      </div>
      <div class="form-group">
        <label>所属群组（可选）</label>
        <select id="upload-group">
          <option value="">无（全局）</option>
        </select>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="upload-ocr" /> 启用 OCR 识别</label>
      </div>
      <div id="upload-progress" class="progress-text" hidden></div>
      <div class="modal-actions">
        <button id="upload-cancel" class="btn-ghost">取消</button>
        <button id="upload-submit">上传</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" class="modal-overlay" hidden>
    <div class="modal-content">
      <h2>确认删除</h2>
      <p id="delete-msg">确定要删除这条语录吗？此操作不可撤销。</p>
      <div class="modal-actions">
        <button id="delete-cancel" class="btn-ghost">取消</button>
        <button id="delete-confirm" class="btn-danger">删除</button>
      </div>
    </div>
  </div>

  <div id="import-modal" class="modal-overlay" hidden>
    <div class="modal-content modal-wide">
      <h2>导入</h2>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-zip">备份文件</button>
        <button class="tab-btn" data-tab="tab-images">图片文件夹</button>
      </div>

      <div id="tab-zip" class="tab-pane">
        <p class="tab-hint">导入之前导出的 .zip 备份文件，恢复全部记录和消息。</p>
        <div class="form-group">
          <label>选择备份文件</label>
          <input type="file" id="import-zip-file" accept=".zip" />
        </div>
        <div id="import-zip-progress" class="progress-text" hidden></div>
        <div class="modal-actions">
          <button id="import-zip-cancel" class="btn-ghost">取消</button>
          <button id="import-zip-submit">导入备份</button>
        </div>
      </div>

      <div id="tab-images" class="tab-pane" hidden>
        <p class="tab-hint">批量导入图片文件作为语录记录（不含原始消息信息）。</p>
        <div class="form-group">
          <label>选择图片（支持多选）</label>
          <input type="file" id="import-images-files" accept="image/*" multiple />
        </div>
        <div class="form-group">
          <label>所属群组</label>
          <select id="import-images-group">
            <option value="">全局</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="import-images-ocr" /> 启用 OCR 识别</label>
        </div>
        <div id="import-images-progress" class="progress-text" hidden></div>
        <div class="modal-actions">
          <button id="import-images-cancel" class="btn-ghost">取消</button>
          <button id="import-images-submit">开始导入</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
