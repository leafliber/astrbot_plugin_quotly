<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotly 语录管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header id="header">
    <h1 id="page-title">Quotly 语录管理</h1>
    <div id="stats-bar">
      <span id="stat-records">0 条记录</span>
      <span id="stat-messages">0 条消息</span>
      <span id="stat-groups">0 个群组</span>
    </div>
  </header>

  <nav id="toolbar">
    <select id="group-filter">
      <option value="">全部群组</option>
    </select>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="搜索语录..." />
      <button id="search-btn">搜索</button>
      <button id="clear-search-btn" hidden>清除</button>
    </div>
    <button id="upload-btn">上传图片</button>
    <button id="export-btn" class="secondary">导出</button>
    <button id="import-btn" class="secondary">导入</button>
  </nav>

  <main>
    <div id="loading" hidden>加载中...</div>

    <section id="records-list"></section>

    <div id="pagination" hidden>
      <button id="prev-btn">上一页</button>
      <span id="page-info">1 / 1</span>
      <button id="next-btn">下一页</button>
    </div>

    <section id="record-detail" hidden>
      <button id="back-btn">← 返回列表</button>
      <div id="detail-content">
        <div id="detail-image-wrap">
          <img id="detail-image" alt="语录图片" />
        </div>
        <div id="detail-info">
          <p id="detail-meta"></p>
          <div id="messages-editor"></div>
          <button id="save-messages-btn" hidden>保存修改</button>
        </div>
      </div>
    </section>

    <div id="empty-state" hidden>
      <p>暂无语录记录</p>
    </div>
  </main>

  <div id="lightbox" hidden>
    <img id="lightbox-img" alt="全尺寸图片" />
  </div>

  <div id="upload-modal" hidden>
    <div class="modal-content">
      <h2>上传语录图片</h2>
      <div class="form-group">
        <label>选择图片（支持多选）</label>
        <input type="file" id="upload-files" accept="image/*" multiple />
      </div>
      <div class="form-group">
        <label>所属群组（可选）</label>
        <select id="upload-group">
          <option value="">无（全局）</option>
        </select>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="upload-ocr" /> 启用 OCR 识别</label>
      </div>
      <div id="upload-progress" hidden></div>
      <div class="modal-actions">
        <button id="upload-cancel">取消</button>
        <button id="upload-submit">上传</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" hidden>
    <div class="modal-content">
      <h2>确认删除</h2>
      <p id="delete-msg">确定要删除这条语录吗？此操作不可撤销。</p>
      <div class="modal-actions">
        <button id="delete-cancel">取消</button>
        <button id="delete-confirm" class="danger">删除</button>
      </div>
    </div>
  </div>

  <div id="import-modal" hidden>
    <div class="modal-content modal-wide">
      <h2>导入</h2>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="tab-zip">备份文件</button>
        <button class="tab-btn" data-tab="tab-images">图片文件夹</button>
      </div>

      <div id="tab-zip" class="tab-pane">
        <p class="tab-hint">导入之前导出的 .zip 备份文件，恢复全部记录和消息。</p>
        <div class="form-group">
          <label>选择备份文件</label>
          <input type="file" id="import-zip-file" accept=".zip" />
        </div>
        <div id="import-zip-progress" hidden></div>
        <div class="modal-actions">
          <button id="import-zip-cancel">取消</button>
          <button id="import-zip-submit">导入备份</button>
        </div>
      </div>

      <div id="tab-images" class="tab-pane" hidden>
        <p class="tab-hint">批量导入图片文件作为语录记录（不含原始消息信息）。</p>
        <div class="form-group">
          <label>选择图片（支持多选）</label>
          <input type="file" id="import-images-files" accept="image/*" multiple />
        </div>
        <div class="form-group">
          <label>所属群组</label>
          <select id="import-images-group">
            <option value="">全局</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="import-images-ocr" /> 启用 OCR 识别</label>
        </div>
        <div id="import-images-progress" hidden></div>
        <div class="modal-actions">
          <button id="import-images-cancel">取消</button>
          <button id="import-images-submit">开始导入</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
